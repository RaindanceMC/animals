id: animals
title: Horses & animal armour
summary: Roads make horses faster, horse armour takes trims, a whistle calls your horse, and foals take after the better parent.
intro: |
  Horses run faster on roads, horse armour takes trims and enchantments, and a whistle calls your horse.
icon: SADDLE
category: Items & enchantments
order: 46
module: animals
aliases: [horse, horses, whistle, horse whistle, breeding, horse stats, horse armour, horse armor]
keywords: [horse, road, highway, path, gravel, speed, jump, health, foal, breed, trim, smithing, whistle, call]
commands: [horses]
sections:
  - question: Are horses faster on roads?
    title: Roads
    text: |
      Yes. On road blocks ({setting:animals:road-blocks}; dirt path is a shovel on grass) your horse runs at {setting:animals:road-percent} % of its own speed, everywhere else at {setting:animals:off-road-percent} %. A fast horse stays faster than a slow one. Roads between your places get you there quicker.
  - question: How fast are the highways?
    title: Highways
    text: |
      {if:animals:highway-top-bps}On the server's highways the best horse there is runs {setting:animals:highway-top-bps} blocks a second, and every other horse, donkey, mule or camel its share of that: a horse half as fast as the best goes half that. Only there; off the highway the road speeds above apply again.{else}This server has no highway speed.{/if}
  - question: How do I see how good a horse is?
    title: Stats
    text: |
      {if:animals:stats.enabled}Ride a horse, or look at one up close: its speed (in blocks a second, and how fast it is right where it stands), jump height and health show above your hotbar. {run:/horses stats} switches that off and on again, just for you.{else}Horse stats are switched off on this server.{/if}
  - question: Does taming make a horse stronger?
    title: Taming
    text: |
      Yes, like a wolf becoming a dog: a tamed horse, donkey or mule has {setting:animals:tamed-health-percent} % of the health it had wild. Its foals still inherit from the wild values, so breeding stays fair.
  - question: How do I breed better horses?
    title: Breeding
    text: |
      {if:animals:breeding.enabled}Breed two horses as usual (golden carrots or golden apples). Every foal lands between its parents, closer to the better one, stat by stat. About one stat in {setting:animals:breeding.better-chance} out of a hundred comes out better than both parents. Pair your best horses and every generation can improve.{else}Breeding works like vanilla here.{/if}
  - question: How does the horse whistle work?
    title: Horse whistle
    text: |
      Craft one from three iron nuggets over a string. Ride one of your own horses once, and the whistle remembers it. Right-click the whistle and that horse teleports to you{if:animals:whistle.reach}, from up to {setting:animals:whistle.reach} blocks away in the same world{else}, wherever you are, even from another world{/if}. It lands a few blocks in front of you, facing you, in your own teleport look. Then the whistle rests for {setting:animals:whistle.cooldown-seconds} seconds.
      It won't call a horse somebody else is riding.
  - question: Can horse or dog armour take a trim?
    title: Animal armour trims
    text: |
      Yes, every horse armour (leather, copper, iron, gold, diamond, netherite) and dog armour takes a trim at a smithing table, just like your own armour: a trim template, the armour and a trim material. Each pattern looks like the one on your own armour.
  - question: How does horse armour work?
    title: Horse armour
    text: |
      Like wolf armour: it takes the hits instead of your horse and wears out doing so. Its durability shows like any tool's. When it breaks, your horse is on its own. Mend it at an anvil with what it is made of (leather, copper, iron, gold, diamond, netherite).
  - question: Can I enchant horse and dog armour?
    title: Enchanting animal armour
    text: |
      Yes, at an enchanting table or with books at an anvil. Everything that goes on works: Protection (and Fire, Blast, Projectile Protection), Thorns, Feather Falling, Depth Strider, Soul Speed, Frost Walker, Respiration, Unbreaking and Mending. Mending takes the experience you pick up while riding (or, for dog armour, while your dog is near you).
